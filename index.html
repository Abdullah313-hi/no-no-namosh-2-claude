<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Finding No-No-Namosh II: The Lost Star</title>
<style>
  :root{
    --bg:#0c1220;
    --panel:#16223a;
    --panel-light:#22314f;
    --accent:#ffcf5c;
    --accent2:#6fe3c9;
    --text:#f2f1ea;
    --text-dim:#b9c2d6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    font-family:'Courier New', monospace;
    touch-action:none;
  }
  #gameRoot{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #gameCanvas{
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background:#000;
    max-width:100vw; max-height:100vh;
    display:block;
  }
  #uiLayer{
    position:absolute; left:0; top:0; width:100%; height:100%;
    pointer-events:none;
  }
  .ui-btn{
    pointer-events:auto;
    background:var(--panel);
    border:2px solid var(--accent);
    color:var(--text);
    font-family:inherit;
    padding:10px 18px;
    font-size:14px;
    cursor:pointer;
    border-radius:6px;
    letter-spacing:1px;
  }
  .ui-btn:active{ background:var(--panel-light); }
  .ui-btn.small{padding:6px 10px; font-size:12px;}

  /* ---- Menus ---- */
  .menu-screen{
    position:absolute; left:0; top:0; width:100%; height:100%;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #1a2740 0%, #060a14 100%);
    pointer-events:auto;
    color:var(--text);
    text-align:center;
    padding:20px;
  }
  .menu-screen.active{display:flex;}
  .title-main{
    font-size:clamp(22px,5vw,40px);
    color:var(--accent);
    text-shadow: 3px 3px 0 #402a00;
    letter-spacing:2px;
    margin-bottom:4px;
  }
  .title-sub{
    font-size:clamp(14px,3vw,20px);
    color:var(--accent2);
    margin-bottom:30px;
    letter-spacing:3px;
  }
  .menu-list{ display:flex; flex-direction:column; gap:12px; width:min(320px,80vw); }
  .menu-list .ui-btn{ width:100%; }
  .lang-row{ display:flex; gap:12px; margin-top:22px; }
  .save-slot{
    background:var(--panel); border:2px solid var(--panel-light);
    border-radius:6px; padding:12px; width:min(360px,85vw);
    text-align:left; cursor:pointer; color:var(--text);
  }
  .save-slot:hover{ border-color:var(--accent); }
  .save-slot .slot-title{ color:var(--accent); font-size:13px; }
  .save-slot .slot-info{ color:var(--text-dim); font-size:11px; margin-top:4px; }

  /* ---- HUD ---- */
  #hud{
    position:absolute; left:0; top:0; width:100%; height:100%;
    pointer-events:none; display:none;
  }
  #hud.active{display:block;}
  #hearts{ position:absolute; top:10px; left:10px; display:flex; gap:4px; }
  .heart{ width:18px; height:18px; }
  #objectiveBar{
    position:absolute; top:10px; right:10px;
    background:rgba(10,15,25,0.75); border:1px solid var(--accent);
    color:var(--text); padding:6px 10px; font-size:11px; max-width:46%;
    border-radius:4px;
  }
  #objectiveBar b{ color:var(--accent); }
  #invBtn, #menuBtn{
    position:absolute; right:10px; pointer-events:auto;
  }
  #invBtn{ bottom:10px; }
  #menuBtn{ bottom:56px; }

  /* Touch controls */
  #touchControls{ display:none; }
  #touchControls.active{ display:block; }
  #dpad{
    position:absolute; left:16px; bottom:16px; width:130px; height:130px;
    pointer-events:auto;
  }
  #dpad .zone{
    position:absolute; width:44px; height:44px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25);
    border-radius:8px;
  }
  #dpad .zone.active{ background:rgba(255,207,92,0.35); }
  #zUp{ left:43px; top:0; } #zDown{ left:43px; top:86px; }
  #zLeft{ left:0; top:43px; } #zRight{ left:86px; top:43px; }
  #actionBtns{
    position:absolute; right:16px; bottom:16px; pointer-events:auto;
    display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  }
  .round-btn{
    width:58px; height:58px; border-radius:50%;
    background:rgba(255,207,92,0.85); border:2px solid #a87a00;
    color:#1a1200; font-weight:bold; font-size:13px;
    display:flex; align-items:center; justify-content:center;
    pointer-events:auto;
  }
  .round-btn.secondary{ background:rgba(111,227,201,0.85); border-color:#0d6b58; width:46px; height:46px; font-size:11px;}

  /* Dialogue box */
  #dialogueBox{
    position:absolute; left:4%; right:4%; bottom:4%;
    background:var(--panel); border:3px solid var(--accent);
    border-radius:10px; padding:14px 16px; display:none;
    pointer-events:auto; color:var(--text);
  }
  #dialogueBox.active{ display:flex; gap:14px; align-items:flex-start; }
  #portraitBox{
    width:64px; height:64px; flex-shrink:0; border:2px solid var(--accent2);
    border-radius:6px; background:#0c1425; overflow:hidden;
  }
  #portraitCanvas{ width:100%; height:100%; image-rendering:pixelated; }
  #dialogueTextWrap{ flex:1; min-width:0; }
  #speakerName{ color:var(--accent); font-size:12px; margin-bottom:4px; letter-spacing:1px; }
  #dialogueText{ font-size:13px; line-height:1.5; min-height:2.6em; }
  #dialogueNext{ text-align:right; font-size:10px; color:var(--text-dim); margin-top:6px; }

  /* Inventory panel */
  #invPanel{
    position:absolute; left:6%; right:6%; top:8%; bottom:8%;
    background:var(--panel); border:3px solid var(--accent2);
    border-radius:10px; padding:16px; display:none; pointer-events:auto;
    overflow-y:auto; color:var(--text);
  }
  #invPanel.active{ display:block; }
  #invPanel h2{ color:var(--accent2); margin-top:0; font-size:16px; }
  #invGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); gap:8px; margin-top:10px;}
  .inv-item{ background:var(--panel-light); border-radius:6px; padding:8px; text-align:center; font-size:10px; }
  .inv-item .ic{ font-size:22px; }

  /* toast */
  #toast{
    position:absolute; top:14%; left:50%; transform:translateX(-50%);
    background:rgba(15,20,35,0.9); border:1px solid var(--accent);
    color:var(--accent); padding:8px 16px; border-radius:6px; font-size:12px;
    opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap;
  }
  #toast.show{ opacity:1; }

  #skipHint{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    font-size:10px; color:var(--text-dim); background:rgba(0,0,0,0.4);
    padding:3px 8px; border-radius:4px; pointer-events:none;
  }
</style>
</head>
<body>

<script>
(function(){
"use strict";

/* =========================================================
   FINDING NO-NO-NAMOSH II: THE LOST STAR
   Chapter-1 vertical slice engine.
   Single-file, no dependencies, GitHub-Pages ready.
   ========================================================= */

/* ---------------- CORE SETUP ---------------- */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const VW = canvas.width, VH = canvas.height;
const TILE = 16;

function fitCanvas(){
  const scale = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  canvas.style.width = (VW*scale)+"px";
  canvas.style.height = (VH*scale)+"px";
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if(isTouch){ document.getElementById('touchControls').classList.add('active'); }

/* ---------------- AUDIO (procedural, original, no external files) ---------------- */
const AudioSys = (function(){
  let actx=null, musicGain=null, sfxGain=null, currentMusic=null;
  let musicVol=0.6, sfxVol=0.7;
  function ensure(){
    if(!actx){
      actx = new (window.AudioContext||window.webkitAudioContext)();
      musicGain = actx.createGain(); musicGain.gain.value = musicVol; musicGain.connect(actx.destination);
      sfxGain = actx.createGain(); sfxGain.gain.value = sfxVol; sfxGain.connect(actx.destination);
    }
  }
  function setMusicVol(v){ musicVol=v; if(musicGain) musicGain.gain.value=v; }
  function setSfxVol(v){ sfxVol=v; if(sfxGain) sfxGain.gain.value=v; }

  // simple original chiptune sequencer: array of [freq or 0, durationBeats]
  function playSfx(freqs, dur=0.08, type='square', vol=0.18){
    ensure();
    let t = actx.currentTime;
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i*dur);
      g.gain.linearRampToValueAtTime(vol, t + i*dur + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*dur + dur);
      o.connect(g); g.connect(sfxGain);
      o.start(t + i*dur); o.stop(t + i*dur + dur + 0.02);
    });
  }
  const SFX = {
    step: ()=>playSfx([220],0.03,'square',0.05),
    interact: ()=>playSfx([440,660],0.05,'square',0.12),
    pickup: ()=>playSfx([523,659,784],0.07,'triangle',0.15),
    quest: ()=>playSfx([392,523,659,784],0.09,'triangle',0.16),
    splash: ()=>playSfx([180,140],0.06,'sine',0.15),
    meow: ()=>playSfx([700,900,600],0.05,'sawtooth',0.1),
    hit: ()=>playSfx([120,80],0.06,'square',0.2),
    bossHit: ()=>playSfx([300,200,100],0.09,'sawtooth',0.22),
    door: ()=>playSfx([260,330],0.06,'triangle',0.12),
    save: ()=>playSfx([523,659,784,1046],0.08,'triangle',0.15),
  };

  // Original looping ambient chiptune themes built from note sequences.
  let musicTimer=null, musicSeqIdx=0, musicSeq=[], musicNoteDur=0.28, musicOscType='triangle';
  function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }
  function playMusic(seq, noteDur, type){
    ensure(); stopMusic();
    musicSeq = seq; musicNoteDur = noteDur; musicOscType = type; musicSeqIdx=0;
    musicTimer = setInterval(step, noteDur*1000);
    step();
  }
  function step(){
    if(!musicSeq.length) return;
    const note = musicSeq[musicSeqIdx % musicSeq.length];
    musicSeqIdx++;
    if(note>0){
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = musicOscType; o.frequency.value = note;
      const t = actx.currentTime;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.09,t+0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t+musicNoteDur*0.95);
      o.connect(g); g.connect(musicGain);
      o.start(t); o.stop(t+musicNoteDur);
    }
  }
  // Themes (simple original melodic loops, not from any copyrighted source)
  const THEMES = {
    apartment: [392,0,440,0,523,0,440,392, 349,0,392,0,440,0,392,0],
    rosewood:  [440,494,523,587,523,494,440,0, 392,440,494,440,392,0,349,0],
    greenhaven:[523,587,659,587,523,494,440,0, 494,523,587,659,587,523,494,0],
    grotto:    [349,392,349,330,294,330,349,0, 262,294,330,294,262,0,247,0],
    battle:    [220,220,247,220,196,220,247,262, 220,220,247,220,262,247,220,0],
  };
  function playTheme(name){ const t=THEMES[name]||THEMES.rosewood; playMusic(t, name==='battle'?0.16:0.3, name==='grotto'?'sine':'triangle'); }

  return { ensure, setMusicVol, setSfxVol, SFX, playTheme, stopMusic };
})();

/* ---------------- LOCALIZATION ---------------- */
let LANG = 'en';
const STR = {
en:{

},

  controlsInfo:"Dator: WASD/Piltangenter rör sig · E interagera · B förmåga · I väska<br>Mobil: skärmens styrspak och knappar",
  satchel:"VÄSKAN", close:"STÄNG", tapContinue:"▼ tryck / mellanslag",
  objective:"MÅL", saved:"Spelet sparat.",
  obj_intro:"Titta dig omkring i lägenheten.",

  obj_chapterEnd:"Slutet på kapitel 1-demot. Fler områden är på väg.",
  itemName_key:"Gammal Grottnyckel", itemName_shell:"Lyckoskal", itemName_fish:"Torkad Fisk",
  itemName_crystal:"Kylkristallskärva",
  toast_gotItem:"Fick: {item}",
},
};
function T(key){ return (STR[LANG] && STR[LANG][key]) || (STR.en[key]) || key; }

/* Dialogue script data (bilingual) lives per-scene below. */

/* ---------------- SAVE SYSTEM ---------------- */
const SAVE_PREFIX = "nonamosh2_slot_";
function saveGame(slot){
  const data = {
    v:1, lang:LANG, scene: Game.currentSceneName,
    player: {x:Game.player.x, y:Game.player.y},
    flags: Game.flags, inventory: Game.inventory,
    timestamp: Date.now(),
  };
  try{ localStorage.setItem(SAVE_PREFIX+slot, JSON.stringify(data)); AudioSys.SFX.save(); showToast(T('saved')); }
  catch(e){ console.warn("save failed", e); }
}
function loadGame(slot){
  try{
    const raw = localStorage.getItem(SAVE_PREFIX+slot);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function slotSummary(slot){
  const d = loadGame(slot);
  if(!d) return null;
  const date = new Date(d.timestamp);
  return { scene:d.scene, date: date.toLocaleString() };
}

/* ---------------- INPUT ---------------- */
const Keys = {};
window.addEventListener('keydown', e=>{
  Keys[e.key.toLowerCase()] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key.toLowerCase()==='e') Input.interactPressed = true;
  if(e.key.toLowerCase()==='b') Input.abilityPressed = true;
  if(e.key.toLowerCase()==='i') toggleInventory();
  if(e.key===' ') Input.confirmPressed = true;
});
window.addEventListener('keyup', e=>{ Keys[e.key.toLowerCase()] = false; });

const Input = { up:false,down:false,left:false,right:false, interactPressed:false, abilityPressed:false, confirmPressed:false };
function pollKeyboard(){
  Input.up = Keys['w']||Keys['arrowup'];
  Input.down = Keys['s']||Keys['arrowdown'];
  Input.left = Keys['a']||Keys['arrowleft'];
  Input.right = Keys['d']||Keys['arrowright'];
}

// touch dpad
function bindZone(el, dir){
  const set = (v)=>{ Input[dir]=v; el.classList.toggle('active',v); };
  el.addEventListener('touchstart', e=>{ e.preventDefault(); set(true); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); set(false); }, {passive:false});
  el.addEventListener('touchcancel', ()=> set(false));
}
bindZone(document.getElementById('zUp'),'up');
bindZone(document.getElementById('zDown'),'down');
bindZone(document.getElementById('zLeft'),'left');
bindZone(document.getElementById('zRight'),'right');
document.getElementById('btnInteract').addEventListener('touchstart', e=>{ e.preventDefault(); Input.interactPressed=true; Input.confirmPressed=true; });
document.getElementById('btnAbility').addEventListener('touchstart', e=>{ e.preventDefault(); Input.abilityPressed=true; });

/* ---------------- SPRITE ASSETS (hand-authored pixel art, embedded as base64
   so the game has zero external file dependencies and can never silently

/* ---------------- TOAST ---------------- */
let toastTimer=null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ---------------- DIALOGUE SYSTEM ---------------- */
const DialogueUI = {
  active:false, queue:[], onDone:null,
  start(lines, onDone){
    this.queue = lines.slice();
    this.onDone = onDone||null;
    this.active = true;
    document.getElementById('dialogueBox').classList.add('active');
    this.next();
  },
  next(){
    if(!this.queue.length){ this.close(); return; }
    const line = this.queue.shift();
    document.getElementById('speakerName').textContent = line.speaker||'';
    document.getElementById('dialogueText').textContent = line.text[LANG]||line.text.en;
    if(line.portrait){
      document.getElementById('portraitBox').style.display='block';
      drawPortrait(line.portrait, line.expr||'neutral');
    } else {
      document.getElementById('portraitBox').style.display='none';
    }
  },
  close(){
    this.active=false;
    document.getElementById('dialogueBox').classList.remove('active');
    const cb = this.onDone; this.onDone=null;
    if(cb) cb();
  }
};
document.getElementById('dialogueBox').addEventListener('click', ()=>{ if(DialogueUI.active) DialogueUI.next(); });

/* ---------------- INVENTORY UI ---------------- */
function toggleInventory(){
  const p = document.getElementById('invPanel');
  const willOpen = !p.classList.contains('active');
  if(willOpen) renderInventory();
  p.classList.toggle('active');
}
function renderInventory(){
  const grid = document.getElementById('invGrid');
  grid.innerHTML='';
  const ICONS = {key:'🗝️', shell:'🐚', fish:'🐟', crystal:'🔷'};
  Game.inventory.forEach(it=>{
    const div = document.createElement('div');
    div.className='inv-item';
    div.innerHTML = `<div class="ic">${ICONS[it]||'✦'}</div><div>${T('itemName_'+it)}</div>`;
    grid.appendChild(div);
  });
  if(!Game.inventory.length){
    grid.innerHTML = '<div style="color:var(--text-dim);font-size:11px;">'+(LANG==='sv'?'Väskan är tom.':'Your satchel is empty.')+'</div>';
  }
}
document.getElementById('invBtn').addEventListener('click', toggleInventory);
document.getElementById('invCloseBtn').addEventListener('click', ()=>document.getElementById('invPanel').classList.remove('active'));
document.getElementById('menuBtn').addEventListener('click', ()=>{
  if(confirm(LANG==='sv'?'Spara och gå till titelskärmen?':'Save and return to title screen?')){
    saveGame(Game.activeSlot||1);
    location.reload();
  }
});

function addItem(id){
  if(Game.inventory.includes(id)) return;
  Game.inventory.push(id);
  AudioSys.SFX.pickup();
  showToast(T('toast_gotItem').replace('{item}', T('itemName_'+id)));
}

function clampPlayerToMap(){
  Game.player.x = Math.max(8, Math.min(Game.mapPixelW-8, Game.player.x));
  Game.player.y = Math.max(8, Math.min(Game.mapPixelH-8, Game.player.y));

function tileAtPixel(px_,py_){
  const gx = Math.floor(px_/TILE), gy = Math.floor(py_/TILE);
  if(!Game.mapGrid || gy<0||gy>=Game.mapGrid.length||gx<0||gx>=Game.mapGrid[0].length) return '#';
  return Game.mapGrid[gy][gx];
}

function isSolidAt(px_,py_){
  const t = tileAtPixel(px_,py_);
  if(SOLID.has(t)) return true;
  // custom colliders (objects)
  for(const c of Game.colliders){
    if(px_>c.x && px_<c.x+c.w && py_>c.y && py_<c.y+c.h) return true;
  }
  return false;
}

function updateBoss(dt){
  const b = Game.boss;
  if(!b || !Game.flags.inBossFight) return;
  b.timer += dt;
  if(b.invuln>0) b.invuln -= dt;
  // simple attack pattern: guardian pulses a shockwave every ~2.4s, telegraphed
  b.attackTimer += dt;
  if(b.attackTimer > 2.4){
    b.attackTimer = 0;
    b.attacking = true;
    b.attackFlash = 0.6;
  }
  if(b.attackFlash!==undefined && b.attackFlash>0){
    b.attackFlash -= dt;
    if(b.attackFlash<=0){
      // resolve hit if player close and didn't dodge
      const dx = Game.player.x-(b.x+8), dy=Game.player.y-(b.y+8);
      const dist = Math.hypot(dx,dy);
      if(dist < 34 && !Game.player.dodging){
        AudioSys.SFX.hit();
        Game.hp = Math.max(0, (Game.hp??3)-1);
        updateHearts();
      }
    }
  }
  // player striking back
  if(Input.interactPressed){
    const dx = Game.player.x-(b.x+8), dy=Game.player.y-(b.y+8);
    if(Math.hypot(dx,dy) < 26 && b.invuln<=0){
      b.hp -= 1; b.invuln = 0.8;
      AudioSys.SFX.bossHit();
      if(b.hp<=0){
        Game.flags.grottoBossDefeated = true;
        Game.flags.inBossFight = false;
        Game.boss = null;
        Game.npcs = Game.npcs.filter(n=>!n.isBoss);
        AudioSys.playTheme('grotto');
        DialogueUI.start([
          {speaker:'', portrait:null, text:{en:'The guardian cracks and stills, folding back into the wall it once guarded.', sv:'Väktaren spricker och tystnar, viker sig tillbaka in i väggen den en gång vaktade.'}},
          {speaker:'Aya', portrait:'aya', expr:'happy', text:{en:'Okay. That is definitely not a normal cat problem anymore.', sv:'Okej. Det där är definitivt inte längre ett normalt kattproblem.'}},
        ], ()=>{
          addItem('crystal');
          setObjective('obj_chapterEnd');
          showChapterEndCard();
        });
      }
    }
  }
}

function loadScene(name, spawnHint){
  Game.currentSceneName = name;
  if(spawnHint==='top') Game.flags.spawnRosewoodTop = true; else Game.flags.spawnRosewoodTop=false;
  if(spawnHint==='bottom') Game.flags.spawnGreenhavenBottom = true; else Game.flags.spawnGreenhavenBottom=false;

  scene.build();

  if(scene.onEnter) scene.onEnter();

/* ---------------- PLAYER UPDATE ---------------- */
function updatePlayer(dt){
  if(DialogueUI.active) return;
  if(document.getElementById('invPanel').classList.contains('active')) return;
  if(Game.flags.inBossFight){ /* movement still allowed to dodge */ }

  pollKeyboard();
  let dx=0, dy=0;
  if(Input.up) dy-=1; if(Input.down) dy+=1;
  if(Input.left) dx-=1; if(Input.right) dx+=1;
  const moving = dx!==0||dy!==0;
  if(moving){
    const len = Math.hypot(dx,dy); dx/=len; dy/=len;
    if(Math.abs(dx)>Math.abs(dy)) Game.player.dir = dx>0?'right':'left';
    else Game.player.dir = dy>0?'down':'up';
  }
  const speed = Game.player.swimming ? 40 : 62;
  const nx = Game.player.x + dx*speed*dt;
  const ny = Game.player.y + dy*speed*dt;

  const atNX = tileAtPixel(nx, Game.player.y);
  const atNY = tileAtPixel(Game.player.x, ny);
  const canWaterX = WATER.has(atNX) ? true : !SOLID.has(atNX);
  const canWaterY = WATER.has(atNY) ? true : !SOLID.has(atNY);

  if(canWaterX && !isSolidAt(nx,Game.player.y)) Game.player.x = nx;
  if(canWaterY && !isSolidAt(Game.player.x,ny)) Game.player.y = ny;
  clampPlayerToMap();

  const curTile = tileAtPixel(Game.player.x, Game.player.y);
  const wasSwimming = Game.player.swimming;
  Game.player.swimming = WATER.has(curTile);
  if(Game.player.swimming && !wasSwimming) AudioSys.SFX.splash();

  Game.player.dodging = moving; // simple: moving counts as dodge attempt window during boss flash

  if(moving){
    Game.player.anim += dt*8;
    if(Math.floor(Game.player.anim)%6===0 && Math.random()<0.15) AudioSys.SFX.step();
  } else { Game.player.anim = 0; }

  // camera
  Game.camera.x = Math.max(0, Math.min(Game.mapPixelW-VW, Game.player.x-VW/2));
  Game.camera.y = Math.max(0, Math.min(Game.mapPixelH-VH, Game.player.y-VH/2));

  // triggers
  for(const tr of Game.triggers){
    if(Game.player.x>tr.x && Game.player.x<tr.x+tr.w && Game.player.y>tr.y && Game.player.y<tr.y+tr.h){
      AudioSys.SFX.door();
      loadScene(tr.to, tr.spawn);
      return;
    }
  }

  // interact
  if(Input.interactPressed && !Game.flags.inBossFight){
    for(const n of Game.npcs){
      const dist = Math.hypot(Game.player.x-(n.x+ (n.w/2||6)), Game.player.y-(n.y+(n.h/2||6)));
      if(dist < 22){
        const lines = n.dialogue();
        if(lines && lines.length) DialogueUI.start(lines);
        Input.interactPressed=false;
        return;
      }
    }
    for(const c of Game.colliders){
      if(!c.name) continue;
      const dist = Math.hypot(Game.player.x-(c.x+c.w/2), Game.player.y-(c.y+c.h/2));
      if(dist < 26 && Scenes[Game.currentSceneName].interactObject){
        Scenes[Game.currentSceneName].interactObject(c.name);
        Input.interactPressed=false;
        return;
      }
    }
    if(Game.currentSceneName==='apartment' && !Game.flags.introCounted){
      const namoshNPC = Game.npcs.find(n=>n.id==='namosh');
      if(namoshNPC){
        const dist = Math.hypot(Game.player.x-namoshNPC.x, Game.player.y-namoshNPC.y);
        if(dist<40) startKittenCount();
      }
    }
  }
  Input.interactPressed = false;
}

/* ---------------- RENDER ---------------- */
function tileSrcIndex(t, gx, gy){
  let idx = TILE_INDEX[t];
  if(idx===undefined) idx = 15;
  // animate water (frame index +1) and vary grass texture by position
  if(t==='.') idx = ((gx*31+gy*17)%5===0) ? 1 : 0;
  if(t==='~') idx = (Math.floor(Date.now()/500)%2===0) ? 2 : 3;
  if(t==='C') idx = (Math.floor(Date.now()/500)%2===0) ? 8 : 9;
  return idx;
}
function drawMap(){
  if(!Game.mapGrid) return;
  const startCol = Math.floor(Game.camera.x/TILE);
  const startRow = Math.floor(Game.camera.y/TILE);
  const cols = Math.ceil(VW/TILE)+2;
  const rowsN = Math.ceil(VH/TILE)+2;
  const useSprites = spriteReady();
  for(let r=0;r<rowsN;r++){
    for(let c=0;c<cols;c++){
      const gy = startRow+r, gx = startCol+c;
      if(gy<0||gx<0||gy>=Game.mapGrid.length||gx>=Game.mapGrid[0].length) continue;
      const t = Game.mapGrid[gy][gx];
      const sx = gx*TILE - Game.camera.x, sy = gy*TILE-Game.camera.y;
      if(useSprites){
        try{
          const idx = tileSrcIndex(t,gx,gy);
          const col = idx%4, row = Math.floor(idx/4);
          ctx.drawImage(Sprites.tiles, col*TILE_SRC, row*TILE_SRC, TILE_SRC, TILE_SRC, sx, sy, TILE, TILE);
        }catch(e){ ctx.fillStyle = TILE_COLORS[t] || '#333'; ctx.fillRect(sx,sy,TILE,TILE); }
      } else {
        ctx.fillStyle = TILE_COLORS[t] || '#333';
        ctx.fillRect(sx,sy,TILE,TILE);
      }
    }
  }
}

function drawColliders(){
  for(const c of Game.colliders){
    ctx.fillStyle = '#8a6a4a';
    ctx.fillRect(c.x-Game.camera.x, c.y-Game.camera.y, c.w, c.h);
  }
}

function drawNPC(n){
  const sx = n.x-Game.camera.x, sy = n.y-Game.camera.y;
  if(sx<-20||sy<-20||sx>VW+20||sy>VH+20) return;
  if(n.isBoss){
    ctx.fillStyle = Game.boss && Game.boss.attackFlash>0 ? '#ff8a5c' : '#5a5a6a';
    ctx.fillRect(sx-2, sy-2, (n.w||14)+4, (n.h||14)+4);
    ctx.fillStyle='#2a2a34';
    ctx.fillRect(sx,sy,n.w||14,n.h||14);
    return;
  }
  if(n.id==='namosh'){
    if(spriteReady()){
      try{
        const t = Date.now()/260;
        const col = Math.floor(t)%4;
        ctx.drawImage(Sprites.namosh, col*NAMOSH_FW, DIR_ROW.down*NAMOSH_FH, NAMOSH_FW, NAMOSH_FH,
          sx-9, sy-10, 18, 12);
        return;
      }catch(e){ /* fall through */ }
    }
    ctx.fillStyle='#111'; ctx.fillRect(sx,sy,12,8);
    ctx.fillStyle='#eee'; ctx.fillRect(sx+2,sy+4,8,5);
    return;
  }
  if(n.id && n.id.startsWith('kitten')){
    if(spriteReady()){
      try{
        ctx.drawImage(Sprites.namosh, 0, DIR_ROW.down*NAMOSH_FH, NAMOSH_FW, NAMOSH_FH,
          sx-6, sy-7, 12, 8);
        return;
      }catch(e){ /* fall through */ }
    }
    ctx.fillStyle='#222'; ctx.fillRect(sx,sy,8,6);
    ctx.fillStyle='#eee'; ctx.fillRect(sx+1,sy+3,6,3);
    return;
  }
  if(n.id==='lever'){
    ctx.fillStyle = Game.flags.grottoWaterRaised? '#6fe3c9':'#8a6a4a';
    ctx.fillRect(sx,sy,10,10);
    return;
  }
  // generic villager
  ctx.fillStyle='#c9915a';
  ctx.fillRect(sx,sy,10,12);
  ctx.fillStyle='#3a2a1a';
  ctx.fillRect(sx,sy-4,10,5);
}

function drawPlayer(){
  const sx = Game.player.x - Game.camera.x, sy = Game.player.y-Game.camera.y;
  const bob = Game.player.swimming ? Math.sin(Date.now()/150)*1.5 : 0;
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(sx, sy+8, 7,3,0,0,Math.PI*2); ctx.fill();

  if(spriteReady()){
    try{
      const row = DIR_ROW[Game.player.dir] ?? 0;
      const moving = Input.up||Input.down||Input.left||Input.right;
      const col = moving ? Math.floor(Game.player.anim)%4 : 0;
      const drawW = 21, drawH = 30;
      const yOff = Game.player.swimming ? 8+bob : 0;
      const wetAlpha = Game.player.swimming ? 0.85 : 1;
      ctx.globalAlpha = wetAlpha;
      ctx.drawImage(Sprites.aya, col*AYA_FW, row*AYA_FH, AYA_FW, AYA_FH,
        sx-drawW/2, sy-drawH+6+yOff, drawW, drawH);
      ctx.globalAlpha = 1;
      return;
    }catch(e){ /* fall through to rect fallback below */ }
  }
  // fallback rectangles if sprites not yet loaded
  const yOff = Game.player.swimming ? 4+bob : 0;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(sx-5, sy-12+yOff, 10, 6);
  ctx.fillStyle = '#f6d9b8';
  ctx.fillRect(sx-3, sy-9+yOff, 6, 4);
  ctx.fillStyle = '#c9a876';
  ctx.fillRect(sx-6, sy-5+yOff, 12, 8);
  if(!Game.player.swimming){
    ctx.fillStyle = '#1f2a4a';
    ctx.fillRect(sx-5, sy+3, 10, 5);
  }
  ctx.fillStyle='#7a2323';
  ctx.fillRect(sx+3, sy-3, 4,6);
}

function drawBossAttackTelegraph(){
  const b = Game.boss;
  if(!b || !Game.flags.inBossFight) return;
  const sx = b.x-Game.camera.x+8, sy = b.y-Game.camera.y+8;
  if(b.attackFlash>0){
    ctx.strokeStyle = 'rgba(255,90,90,'+Math.min(1,b.attackFlash)+')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx,sy,34,0,Math.PI*2); ctx.stroke();
  }
  // boss hp bar
  ctx.fillStyle='#000'; ctx.fillRect(VW/2-40,10,80,8);
  ctx.fillStyle='#ff5c5c'; ctx.fillRect(VW/2-38,12, 76*(b.hp/b.maxHp),4);
}

function render(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,VW,VH);
  if(Game.currentSceneName==='title') return;
  drawMap();
  drawColliders();
  const drawables = Game.npcs.map(n=>({y:n.y, draw:()=>drawNPC(n)}));
  drawables.push({y:Game.player.y, draw:drawPlayer});
  drawables.sort((a,b)=>a.y-b.y);
  drawables.forEach(d=>d.draw());
  drawBossAttackTelegraph();

  // Namosh scratched trail sparkle (visual guidance in Greenhaven)
  if(Game.currentSceneName==='greenhaven'){
    ctx.fillStyle='rgba(255,207,92,0.5)';
    const t = Date.now()/300;
    for(let i=0;i<4;i++){
      const px_=(11+i)*TILE - Game.camera.x, py_=(9)*TILE - Game.camera.y + Math.sin(t+i)*2;
      ctx.fillRect(px_,py_,3,3);
    }
  }
}

/* ---------------- MAIN LOOP ---------------- */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-lastT)/1000);
  lastT = now;
  updatePlayer(dt);
  updateBoss(dt);
  render();
  Input.abilityPressed=false; Input.confirmPressed=false;
  requestAnimationFrame(loop);
}

/* ---------------- MENU WIRING ---------------- */
function applyLangTexts(){
  document.getElementById('txtTitleMain').textContent = T('titleMain');
  document.getElementById('txtTitleSub').textContent = T('titleSub');
  document.getElementById('btnNewGame').textContent = T('newGame');
  document.getElementById('btnContinue').textContent = T('cont');
  document.getElementById('btnOptions').textContent = T('options');
  document.getElementById('txtSelectSlot').textContent = T('selectSlot');
  document.getElementById('btnSlotsBack').textContent = T('back');
  document.getElementById('txtOptions').textContent = T('options');
  document.getElementById('optMusicLbl').textContent = T('musicVol');
  document.getElementById('optSfxLbl').textContent = T('sfxVol');
  document.getElementById('optControlsLbl').innerHTML = T('controlsInfo');
  document.getElementById('btnOptionsBack').textContent = T('back');
  document.getElementById('invTitle').textContent = T('satchel');
  document.getElementById('invCloseBtn').textContent = T('close');
  document.getElementById('objLabel').textContent = T('objective');
}
document.getElementById('btnLangEN').addEventListener('click', ()=>{ LANG='en'; applyLangTexts(); });
document.getElementById('btnLangSV').addEventListener('click', ()=>{ LANG='sv'; applyLangTexts(); });

function showScreen(id){
  document.querySelectorAll('.menu-screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

document.getElementById('btnOptions').addEventListener('click', ()=>showScreen('screenOptions'));
document.getElementById('btnOptionsBack').addEventListener('click', ()=>showScreen('screenTitle'));
document.getElementById('musicVol').addEventListener('input', e=>AudioSys.setMusicVol(e.target.value/100));
document.getElementById('sfxVol').addEventListener('input', e=>AudioSys.setSfxVol(e.target.value/100));

document.getElementById('btnNewGame').addEventListener('click', ()=>{
  renderSlotList(true);
  showScreen('screenSlots');
});
document.getElementById('btnContinue').addEventListener('click', ()=>{
  renderSlotList(false);
  showScreen('screenSlots');
});
document.getElementById('btnSlotsBack').addEventListener('click', ()=>showScreen('screenTitle'));

function renderSlotList(isNew){
  const wrap = document.getElementById('slotList');
  wrap.innerHTML='';
  for(let s=1;s<=3;s++){
    const summary = slotSummary(s);
    const div = document.createElement('div');
    div.className='save-slot';
    div.innerHTML = `<div class="slot-title">SLOT ${s}</div><div class="slot-info">${summary? (summary.scene+' — '+summary.date) : T('empty')}</div>`;
    div.addEventListener('click', ()=>{
      Game.activeSlot = s;
      AudioSys.ensure();
      if(isNew || !summary){
        beginNewGame();
      } else {
        beginContinue(s);
      }
    });
    wrap.appendChild(div);
  }
}

function beginNewGame(){
  Game.flags = {}; Game.inventory=[]; Game.hp=3; Game.maxHp=3;
  document.getElementById('hud').classList.add('active');
  updateHearts();
  loadScene('apartment');
  hideAllMenus();
}
function beginContinue(slot){
  const d = loadGame(slot);
  if(!d){ beginNewGame(); return; }
  LANG = d.lang||'en'; applyLangTexts();
  Game.flags = d.flags||{}; Game.inventory = d.inventory||[];
  Game.hp = 3; Game.maxHp = 3;
  document.getElementById('hud').classList.add('active');
  updateHearts();
  const scene = d.scene && Scenes[d.scene] ? d.scene : 'apartment';
  loadScene(scene);
  if(d.player){ Game.player.x=d.player.x; Game.player.y=d.player.y; }
  hideAllMenus();
}
function hideAllMenus(){
  document.querySelectorAll('.menu-screen').forEach(s=>s.classList.remove('active'));
}

/* boot */
applyLangTexts();
updateHearts();
requestAnimationFrame(loop);

// periodic autosave
setInterval(()=>{
  if(Game.currentSceneName!=='title' && Game.currentSceneName){
    saveGame(Game.activeSlot||1);
  }
}, 45000);

})();
</script>
